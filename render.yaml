services:
  # Express API Server
  - type: web
    name: nexusnotes-api
    env: node
    buildCommand: npm install && npm run build --workspace=server
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PORT
        value: 5000

  # Next.js Frontend App
  - type: web
    name: nexusnotes-web
    env: node
    buildCommand: npm install && npm run build --workspace=web
    startCommand: npm run start --workspace=web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
